<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Вхід · The Frame Manager</title>
    <script>
        try { var t = localStorage.getItem('tfm-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--s5) var(--s4); }
        .login-card { width: 100%; max-width: 400px; }
        .login-brand { display: flex; flex-direction: column; align-items: center; gap: var(--s3); margin-bottom: var(--s5); text-align: center; }
        .login-brand .brand-logo { width: 56px; height: 56px; border-radius: 16px; }
        .login-brand .brand-logo svg.i { width: 30px; height: 30px; }
        .login-brand h1 { font-size: 1.75rem; }
        .pw-toggle { min-height: var(--tap); padding: 0 12px; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; border-radius: 0 var(--r-s) var(--r-s) 0; }
    </style>
</head>
<body>
    {{ icon_sprite() }}
    <main class="login">
        <div class="login-card">
            <div class="login-brand">
                <span class="brand-logo">{{ icon('cup') }}</span>
                <div><h1>The Frame</h1><p class="muted">Увійдіть, щоб побачити свою кав'ярню</p></div>
            </div>
            <form class="card form" method="post" action="/login" novalidate>
                {% if error %}
                <div class="notice notice-danger" role="alert">{{ icon('alert') }}<div class="notice-body">{{ error }}</div></div>
                {% endif %}
                <div class="field">
                    <label class="field-label" for="username">Логін</label>
                    <input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                </div>
                <div class="field">
                    <label class="field-label" for="password">Пароль</label>
                    <div class="input-group">
                        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
                        <button class="pw-toggle" type="button" id="pw-toggle" aria-controls="password" aria-pressed="false">Показати</button>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Увійти</button>
            </form>
        </div>
    </main>
    <script>
        (function () {
            var b = document.getElementById('pw-toggle'), i = document.getElementById('password');
            b.addEventListener('click', function () {
                var show = i.type === 'password';
                i.type = show ? 'text' : 'password';
                b.textContent = show ? 'Сховати' : 'Показати';
                b.setAttribute('aria-pressed', String(show));
                b.setAttribute('aria-label', show ? 'Сховати пароль' : 'Показати пароль');
                i.focus();
            });
        })();
    </script>
</body>
</html>
